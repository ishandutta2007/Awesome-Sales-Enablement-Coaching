<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Background Dynamic Elements (Animations placed strictly in background) */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dashOffset {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }

    .bg-pulse-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-pulse-2 { animation: pulseGlow 8s ease-in-out infinite 1s; transform-origin: 1000px 280px; }
    .float-item { animation: floatParticle 5s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 20, 10; animation: dashOffset 10s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Decorative Dynamic Glows (Behind all content) -->
  <circle class="bg-pulse-1" cx="150" cy="80" r="180" fill="#3b82f6" opacity="0.25" filter="url(#glow)" />
  <circle class="bg-pulse-2" cx="1050" cy="280" r="200" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" />

  <!-- Background Geometric Grid Pattern -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Background Animated Flow Lines -->
  <path class="animated-line" d="M -50 280 Q 300 340 600 280 T 1250 220" fill="none" stroke="url(#accent-cyan)" stroke-width="2" opacity="0.4" />
  <path class="animated-line" d="M -50 100 Q 400 20 800 120 T 1250 80" fill="none" stroke="url(#accent-purple)" stroke-width="2" opacity="0.3" />

  <!-- Right Side Background Decorative Cards & Pills (Offset to right to avoid overlapping text) -->
  <g class="float-item" opacity="0.85">
    <!-- Mini Metric Card 1 -->
    <rect x="820" y="60" width="220" height="70" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" />
    <circle cx="850" cy="95" r="16" fill="#3b82f6" opacity="0.3" />
    <text x="850" y="100" font-family="sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">🎯</text>
    <text x="880" y="88" font-family="sans-serif" font-size="12" fill="#94a3b8">Sales Readiness</text>
    <text x="880" y="108" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">98.4% Pitch Score</text>

    <!-- Mini Metric Card 2 -->
    <rect x="900" y="155" width="230" height="70" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" />
    <circle cx="930" cy="190" r="16" fill="#10b981" opacity="0.3" />
    <text x="930" y="195" font-family="sans-serif" font-size="16" fill="#34d399" text-anchor="middle">📈</text>
    <text x="960" y="183" font-family="sans-serif" font-size="12" fill="#94a3b8">Coaching Analytics</text>
    <text x="960" y="203" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">+42% Quota Attainment</text>

    <!-- Mini Metric Card 3 -->
    <rect x="780" y="240" width="210" height="65" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" />
    <circle cx="810" cy="272" r="16" fill="#a855f7" opacity="0.3" />
    <text x="810" y="277" font-family="sans-serif" font-size="16" fill="#c084fc" text-anchor="middle">⚡</text>
    <text x="840" y="265" font-family="sans-serif" font-size="12" fill="#94a3b8">Open-Source Ecosystem</text>
    <text x="840" y="285" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">20+ Top Repos</text>
  </g>

  <!-- Foreground Content Area (Guaranteed Unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="70" width="240" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="16" y="91" class="badge-text">🚀 CURATED ECOSYSTEM 2026</text>

    <!-- Main Title (Clear Foreground) -->
    <text x="0" y="155" class="title">Awesome Sales Enablement</text>
    <text x="0" y="205" class="title" fill="url(#accent-cyan)">&amp; Coaching</text>

    <!-- Subtitle (Clear Foreground) -->
    <text x="0" y="255" class="subtitle">Commercial SaaS Platforms &amp; Open-Source Learning Infrastructure</text>
    <text x="0" y="282" class="subtitle" font-size="15" fill="#64748b">Content Enablement • Pitch Practice • AI Conversation Intelligence • LMS &amp; CRMs</text>
  </g>
</svg>
